# @file .github/workflows/ci.yml
# Purpose: .github / workflows / ci module.
#
# Table of contents:
# 1. Workflow or configuration
# End file heading

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
