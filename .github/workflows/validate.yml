name: Validate

on:
  workflow_call:
    outputs:
      prerelease:
        description: Whether the verified tag is a prerelease.
        value: ${{ jobs.validate.outputs.prerelease }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - name: Check out source and tag ancestry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.14.1"
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check, test, and build offline
        run: npm run verify

      - name: Verify tag and extract release notes
        id: release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release-check.ts "$RELEASE_TAG"

      - name: Upload verified artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-files
          path: dist/
          if-no-files-found: error
          retention-days: 7
