name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event.deleted == false
    uses: ./.github/workflows/validate.yml

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download verified artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          IS_PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          set -euo pipefail
          test -s dist/acga_tool.min.js
          test -s dist/acga_tool.user.js
          test -s dist/release-notes.md
          release_args=(
            "$RELEASE_TAG"
            "dist/acga_tool.min.js"
            "dist/acga_tool.user.js"
            "--verify-tag"
            "--title" "ACGATool ${RELEASE_TAG#v}"
            "--notes-file" "dist/release-notes.md"
          )
          if [[ "$IS_PRERELEASE" == 'true' ]]; then
            release_args+=("--prerelease")
          fi
          gh release create "${release_args[@]}"
